AWSTemplateFormatVersion: '2010-09-09'
Description: BatchLens document image registry; deploy before building the application
  stack.
Parameters:
  Prefix:
    Type: String
    Default: batchlens-doc-dev
    AllowedPattern: '[a-z][a-z0-9-]{2,28}'
Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName:
        Fn::Sub: ${Prefix}-documents
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
Outputs:
  RepositoryUri:
    Value:
      Fn::GetAtt:
      - Repository
      - RepositoryUri
  RepositoryArn:
    Value:
      Fn::GetAtt:
      - Repository
      - Arn
  RepositoryName:
    Value:
      Ref: Repository
