schema_version: 1
input:
  reviewed_html_path: ./inputs/reviewed.html
knowledge:
  snapshot_directory: ./knowledge/flat-v1
output:
  directory: ./results
extraction:
  presets: [materials_with_quantities]
  components: []
  fuzzy_enabled: false
resources:
