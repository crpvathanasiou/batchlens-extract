[tool.poetry]
name = "batchlens-extract"
version = "0.1.0"
description = "Pharma batch extraction"
readme = "README.md"
packages = [{ include = "app", from = "src" }]
include = [{ path = "src/app/document_review/static/**/*", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
fastapi = "^0.116.1"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic-settings = "^2.4.0"
openai = "^2.30.0"
boto3 = ">=1.40,<2"
pyjwt = {version = ">=2.10,<3", extras = ["crypto"]}
amazon-textract-textractor = "1.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"
ruff = "^0.6.0"
pyright = "^1.1.380"
pytest-asyncio = "^0.24.0"
boto3-stubs = {version = ">=1.40,<2", extras = ["dynamodb", "s3", "sqs", "textract"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
